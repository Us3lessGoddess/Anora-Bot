services:
  - type: web
    name: wizard-battle
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
